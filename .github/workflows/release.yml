name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Debug npm auth context
        run: |
          #region agent log
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::hypothesis=H1 node_auth_token_present=true"
          else
            echo "::notice::hypothesis=H1 node_auth_token_present=false"
          fi

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::hypothesis=H2 oidc_runtime_available=true"
          else
            echo "::notice::hypothesis=H2 oidc_runtime_available=false"
          fi
          #endregion
      - run: npm ci
      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
      - run: npm run check
      - name: Publish to npm (Trusted Publishing)
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          #region agent log
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::hypothesis=H3 publish_path_has_token=true"
            exit 1
          else
            echo "::notice::hypothesis=H3 publish_path_has_token=false"
          fi
          #endregion
          npm publish --provenance
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
